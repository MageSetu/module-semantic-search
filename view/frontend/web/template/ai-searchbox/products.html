<div class="products-grid-container">
    <!-- ko if: getMessage() -->
    <div class="ai-message-block">
        <div class="ai-avatar" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L13.5 8.5L20 7L14.5 11.5L17 18L12 14L7 18L9.5 11.5L4 7L10.5 8.5L12 2Z"></path>
            </svg>
        </div>
        <div class="ai-message-content">
            <p class="ai-message-label" translate="'Here are our top picks for you'"></p>
            <div class="message" data-bind="html: getMessage()"></div>
        </div>
    </div>
    <!-- /ko -->

    <!-- ko if: getProducts().length -->
    <div class="product-grid" data-bind="foreach: getProducts()">
        <div class="product-card">
            <div class="product-image-wrapper">
                <img data-bind="attr: { src: $data.image_url, alt: $data.name }" class="product-image" />
            </div>
            <div class="product-card-body">
                <h3 class="product-name" data-bind="text: $data.name"></h3>
                <strong class="product-price" data-bind="text: $data.price"></strong>
                <a data-bind="attr: { href: $data.link }" class="product-link" translate="'View Product'"></a>
            </div>
        </div>
    </div>
    <!-- /ko -->
</div>
